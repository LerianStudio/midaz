components:
  schemas:
    AccountAsset:
      additionalProperties: false
      properties:
        accountId:
          type: string
        asset:
          $ref: "#/components/schemas/AssetRef"
      required:
        - accountId
        - asset
      type: object
    AccountContext:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          type: object
        status:
          examples:
            - active
          type: string
        type:
          examples:
            - checking
          type: string
      required:
        - accountId
        - type
        - status
      type: object
    Actor:
      additionalProperties: false
      properties:
        actorType:
          examples:
            - user
          type: string
        id:
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        ipAddress:
          examples:
            - 203.0.113.42
          type: string
        name:
          examples:
            - Jane Doe
          type: string
        role:
          examples:
            - admin
          type: string
      required:
        - actorType
        - id
        - name
        - ipAddress
      type: object
    AssetAmount:
      additionalProperties: false
      properties:
        amount:
          examples:
            - "12500.00"
          type: string
        asset:
          examples:
            - USD
          type: string
      required:
        - asset
        - amount
      type: object
    AssetRef:
      additionalProperties: false
      properties:
        code:
          type: string
        id:
          type: string
        namespace:
          type: string
      required:
        - namespace
        - id
        - code
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          examples:
            - VALIDATE
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          additionalProperties: {}
          type: object
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        eventId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        eventType:
          examples:
            - TRANSACTION_VALIDATED
          type: string
        hash:
          examples:
            - a3f1e2b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2
          type: string
        metadata:
          additionalProperties: {}
          type: object
        previousHash:
          examples:
            - b4e2f3a5c6d7e8f9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
          type: string
        resourceId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        resourceType:
          examples:
            - transaction
          type: string
        result:
          examples:
            - ALLOW
          type: string
      required:
        - eventId
        - eventType
        - createdAt
        - action
        - result
        - resourceId
        - resourceType
        - actor
      type: object
    BindContextPolicyDocument:
      additionalProperties: false
      properties:
        contextId:
          maxLength: 256
          minLength: 1
          type: string
        expectedVersion:
          description: Omit only to create a new binding; replacement requires its current version.
          format: int64
          minimum: 1
          type: integer
        integrationId:
          maxLength: 256
          minLength: 1
          type: string
        policyId:
          format: uuid
          type: string
        policyRevision:
          format: int64
          minimum: 1
          type: integer
      required:
        - integrationId
        - contextId
        - policyId
        - policyRevision
      type: object
    CompletionRequest:
      additionalProperties: false
      properties:
        contractRevision:
          enum:
            - context-reserve-1
          type: string
      required:
        - contractRevision
      type: object
    Context:
      additionalProperties: false
      properties:
        accounts:
          items:
            $ref: "#/components/schemas/EvaluationAccount"
          type: array
        entries:
          items:
            $ref: "#/components/schemas/Entry"
          type: array
      required:
        - accounts
        - entries
      type: object
    ContextPolicyBindingDocument:
      additionalProperties: false
      properties:
        contextId:
          type: string
        integrationId:
          type: string
        policyId:
          format: uuid
          type: string
        policyRevision:
          format: int64
          type: integer
        version:
          format: int64
          type: integer
      required:
        - integrationId
        - contextId
        - policyId
        - policyRevision
        - version
      type: object
    ContextPolicyDocument:
      additionalProperties: false
      properties:
        defaultDecision:
          description: Explicit default; use DENY for the initial policy.
          enum:
            - ALLOW
            - DENY
          type: string
        id:
          format: uuid
          type: string
        revision:
          format: int64
          minimum: 1
          type: integer
        rules:
          items:
            $ref: "#/components/schemas/ContextPolicyRuleDocument"
          type: array
      required:
        - id
        - revision
        - defaultDecision
        - rules
      type: object
    ContextPolicyRuleDocument:
      additionalProperties: false
      properties:
        action:
          enum:
            - ALLOW
            - DENY
            - REVIEW
          type: string
        expression:
          minLength: 1
          type: string
        id:
          format: uuid
          type: string
        revision:
          format: int64
          minimum: 1
          type: integer
      required:
        - id
        - revision
        - expression
        - action
      type: object
    CreateLimitInput:
      additionalProperties: true
      properties:
        activeTimeEnd:
          examples:
            - "17:00"
          type: string
        activeTimeStart:
          examples:
            - "09:00"
          type: string
        asset:
          description: Native asset code, preserved exactly; at most 256 UTF-8 bytes. AssetRef supplies economic identity.
          examples:
            - USD
          maxLength: 256
          minLength: 1
          type: string
        customEndDate:
          examples:
            - "2026-11-29T00:00:00Z"
          format: date-time
          type: string
        customStartDate:
          examples:
            - "2026-11-27T00:00:00Z"
          format: date-time
          type: string
        description:
          maxLength: 1000
          type: string
        limitType:
          enum:
            - DAILY
            - MONTHLY
            - PER_TRANSACTION
            - WEEKLY
            - CUSTOM
          examples:
            - DAILY
          type: string
        maxAmount:
          description: Positive exact decimal amount; no binary floating-point conversion.
          examples:
            - "1000.00"
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          maxItems: 100
          minItems: 1
          type: array
      required:
        - name
        - limitType
        - maxAmount
        - asset
        - scopes
      type: object

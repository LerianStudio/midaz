        asset:
          examples:
            - USD
          type: string
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        decision:
          examples:
            - ALLOW
          type: string
        evaluatedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array

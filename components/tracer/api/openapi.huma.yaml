  securitySchemes:
    ApiKeyAuth:
      description: Static API key presented in the X-API-Key header.
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      bearerFormat: JWT
      description: JWT bearer token issued by the identity provider.
      scheme: bearer
      type: http
    ProducerMTLS:
      description: Verified producer certificate registered to the integration namespace.
      type: mutualTLS
info:
  title: Midaz Tracer API
  version: 4.0.0
openapi: 3.1.0
paths:
  /audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - description: Start date (RFC3339 format)
          explode: false
          in: query
          name: start_date
          schema:
            description: Start date (RFC3339 format)
            type: string
        - description: End date (RFC3339 format)
          explode: false
          in: query
          name: end_date
          schema:
            description: End date (RFC3339 format)
            type: string
        - description: Filter by event type (TRANSACTION_VALIDATED, RULE_*, LIMIT_*, POLICY_PUBLISHED, POLICY_BOUND, RESERVE_OPERATION_CONFIRMED, RESERVE_OPERATION_RELEASED)
          explode: false
          in: query
          name: event_type
          schema:
            description: Filter by event type (TRANSACTION_VALIDATED, RULE_*, LIMIT_*, POLICY_PUBLISHED, POLICY_BOUND, RESERVE_OPERATION_CONFIRMED, RESERVE_OPERATION_RELEASED)
            type: string
        - description: Filter by action (VALIDATE, CREATE, UPDATE, DELETE, ACTIVATE, DEACTIVATE, DRAFT, CONFIRM, RELEASE)
          explode: false
          in: query
          name: action
          schema:
            description: Filter by action (VALIDATE, CREATE, UPDATE, DELETE, ACTIVATE, DEACTIVATE, DRAFT, CONFIRM, RELEASE)
            type: string
        - description: Filter by result (SUCCESS, FAILED, ALLOW, DENY, REVIEW)
          explode: false
          in: query
          name: result
          schema:
            description: Filter by result (SUCCESS, FAILED, ALLOW, DENY, REVIEW)
            type: string
        - description: Filter by resource type (transaction, rule, limit, policy, reserve_operation)
          explode: false
          in: query
          name: resource_type
          schema:
            description: Filter by resource type (transaction, rule, limit, policy, reserve_operation)
            type: string
        - description: Filter by resource ID (UUID)
          explode: false
          in: query
          name: resource_id
          schema:
            description: Filter by resource ID (UUID)
            type: string
        - description: Filter by actor type (user, system)
          explode: false
          in: query
          name: actor_type
          schema:
            description: Filter by actor type (user, system)
            type: string
        - description: Filter by actor ID
          explode: false
          in: query
          name: actor_id
          schema:
            description: Filter by actor ID
            type: string
        - description: Filter by account ID (UUID)
          explode: false
          in: query
          name: account_id
          schema:
            description: Filter by account ID (UUID)
            type: string
        - description: Filter by segment ID (UUID)
          explode: false
          in: query
          name: segment_id
          schema:
            description: Filter by segment ID (UUID)
            type: string
        - description: Filter by portfolio ID (UUID)
          explode: false
          in: query
          name: portfolio_id
          schema:
            description: Filter by portfolio ID (UUID)
            type: string
        - description: Filter by transaction type (CARD, WIRE, PIX, CRYPTO)
          explode: false
          in: query
          name: transaction_type
          schema:
            description: Filter by transaction type (CARD, WIRE, PIX, CRYPTO)
            type: string
        - description: Filter by matched rule ID (UUID)
          explode: false
          in: query
          name: matched_rule_id
          schema:
            description: Filter by matched rule ID (UUID)
            type: string
        - description: "Max items per page (1-1000, default: 100)"
          explode: false
          in: query
          name: limit
          schema:
            description: "Max items per page (1-1000, default: 100)"
            type: string
        - description: Pagination token (empty for first page)
          explode: false
          in: query
          name: cursor
          schema:
            description: Pagination token (empty for first page)
            type: string
        - description: Sort field (created_at, event_type)
          explode: false
          in: query
          name: sort_by
          schema:
            description: Sort field (created_at, event_type)
            type: string
        - description: Sort direction (ASC, DESC)
          explode: false
          in: query
          name: sort_order
          schema:
            description: Sort direction (ASC, DESC)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditEventsResponse"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: List audit events
      tags:
        - Audit
  /audit-events/{id}:
    get:
      operationId: getAuditEvent
      parameters:
        - description: Audit event ID (UUID)
          in: path
          name: id
          required: true
          schema:
            description: Audit event ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Get an audit event by ID
      tags:
        - Audit
  /audit-events/{id}/verify:
    get:
      operationId: verifyAuditEvent
      parameters:
        - description: Audit event ID (UUID)
          in: path
          name: id
          required: true
          schema:
            description: Audit event ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashChainVerificationResult"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Verify audit event hash chain integrity
      tags:
        - Audit
  /dashboard/fraud-types:
    get:
      description: Returns DENY + REVIEW decisions broken down by transaction type, with each type's share of the flagged traffic.
      operationId: getDashboardFraudTypes
      parameters:
        - description: "Relative window: 7d, 30d or 90d (default: 30d). Mutually exclusive with start_date/end_date."
          explode: false
          in: query
          name: period
          schema:
            description: "Relative window: 7d, 30d or 90d (default: 30d). Mutually exclusive with start_date/end_date."
            type: string
        - description: Window start (RFC3339). Requires end_date. Mutually exclusive with period.
          explode: false
          in: query
          name: start_date
          schema:
            description: Window start (RFC3339). Requires end_date. Mutually exclusive with period.
            type: string
        - description: Window end (RFC3339), exclusive. Requires start_date. Window may not exceed 90 days.
          explode: false
          in: query
          name: end_date
          schema:
            description: Window end (RFC3339), exclusive. Requires start_date. Window may not exceed 90 days.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFraudTypes"
          description: OK
          headers:

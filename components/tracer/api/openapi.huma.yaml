            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Get dashboard headline metrics
      tags:
        - Dashboard

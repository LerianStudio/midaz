              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Get dashboard flagged-traffic breakdown
      tags:
        - Dashboard
  /dashboard/metrics:
    get:
      description: Returns validation counts, decision rates, blocked volume per asset, mean decision latency and the live active rule and limit counts for the window.
      operationId: getDashboardMetrics
      parameters:
        - description: "Relative window: 7d, 30d or 90d (default: 30d). Mutually exclusive with start_date/end_date."
          explode: false
          in: query
          name: period

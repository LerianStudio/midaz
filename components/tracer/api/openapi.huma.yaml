        matchedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        processingTimeMs:
          examples:
            - 12.5
          format: double
          type: number
        reason:
          examples:
            - Transaction denied by rule 'Block high-value checking transactions'
          type: string
        requestId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        totalRulesLoaded:
          examples:
            - 42
          format: int64
          type: integer
        truncated:
          examples:
            - false
          type: boolean
        validationId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
      required:
        - validationId
        - requestId
        - limitUsageDetails
        - processingTimeMs
        - evaluatedAt
        - decision
        - matchedRuleIds
        - evaluatedRuleIds
        - reason
        - totalRulesLoaded
        - truncated
      type: object
    ValidationSummary:
      additionalProperties: false
      properties:
        accountId:
          format: uuid
          type: string
        amount:
          examples:
            - "100.00"
          type: string
        asset:
          examples:
            - USD
          type: string
        createdAt:
          format: date-time
          type: string
        decision:
          examples:
            - ALLOW
          type: string
        exceededLimitIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        matchedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        portfolioId:
          format: uuid
          type: string
        processingTimeMs:
          examples:
            - 12.5
          format: double
          type: number
        reason:
          examples:
            - All rules passed

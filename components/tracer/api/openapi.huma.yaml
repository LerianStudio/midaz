            description: "Relative window: 7d, 30d or 90d (default: 30d). Mutually exclusive with start_date/end_date."
            type: string
        - description: Window start (RFC3339). Requires end_date. Mutually exclusive with period.
          explode: false
          in: query
          name: start_date
          schema:
            description: Window start (RFC3339). Requires end_date. Mutually exclusive with period.
            type: string
        - description: Window end (RFC3339), exclusive. Requires start_date. Window may not exceed 90 days.
          explode: false
          in: query
          name: end_date
          schema:
            description: Window end (RFC3339), exclusive. Requires start_date. Window may not exceed 90 days.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        "422":
          content:
            application/problem+json:

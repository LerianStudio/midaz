  - { resource: encryption, action: delete, effect: allow, roles: [editor], level: organizationId }
  - { resource: encryption, action: head,   effect: allow, roles: [editor, contributor, viewer], level: organizationId }
  - { resource: encryption, action: patch,  effect: allow, roles: [editor, contributor], level: organizationId }

roles:
  # Group bindings are CONFIRMED against the central Access Manager seed
  # (caradhras, deploy/pam-seed/init_data.json): the real groups are
  # midaz-{editor,contributor,viewer}-group, plus the platform-owned admin-group
  # that the editor role is also granted to. The manifest only REFERENCES
  # pre-existing groups, it never creates them — a name absent from the seed
  # reconciles into a role with zero members.
  #
  # admin-group is the PLATFORM admin group (lerian/admin-group, seeded, holds the
  # console admin in every tier), written BARE like every other group name here —
  # the reconciler composes the "lerian/" owner. The seed already binds
  # midaz-editor-role to it, so naming it here MIRRORS the seed rather than
  # widening anything, and it is what lets those per-product admin rows retire
  # without locking the platform admin out of the ledger screens (decision of
  # 2026-09-18, the br-sisbajud pattern). contributor and viewer are NOT granted to
  # it, matching the seed: the editor tier already covers everything they reach.
  #
  # All THREE seeded tiers are declared. `contributor` is not decorative: the
  # seed's midaz-contributor-role grants the full resource set at get/post/patch
  # (every mutating verb except delete), and once the tenant-manager's
  # template-origin prune runs, whatever this manifest does not declare stops
  # existing. Declaring only editor/viewer would silently revoke every member of
  # midaz-contributor-group.
  - name: editor
    granted_to:
      - group: midaz-editor-group
      # seed: midaz-editor-role -> lerian/admin-group (see the admin-group note above)
      - group: admin-group
  - name: contributor
    granted_to:
      - group: midaz-contributor-group
  - name: viewer
    granted_to:
      - group: midaz-viewer-group

m2m:
  # EXPORT: midaz exposes its M2M editor surface so a peer service that declares a
  # `needs: [midaz]` edge can reconcile against it.
  exposed: true
  # IMPORT: the ledger reaches the tracer reservation seam (TRACER_BASE_URL, gRPC)
  # with its Access Manager application token, so its clients need the single
  # tracer reservations/post grant.
  needs:
    - tracer

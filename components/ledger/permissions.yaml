# Access-Manager RI (Responsibility Inversion) declaration manifest.
#
# Identity (service slug): "midaz" — the core ledger + embedded CRM. This is the
# FIRST argument of every auth.Authorize("midaz", resource, verb) guard in
# components/ledger/internal/adapters/http/in/ (const midazName, routes.go:20;
# the CRM routes reuse it via protectedMidaz too).
# Keys mirror the yaml tags on lib-auth/v5 auth/declaration.DeclarationManifest
# (auth/declaration/manifest.go).
#
# WHAT THIS MANIFEST IS: a faithful mirror of the Access-Manager SEED, not a
# transcript of the route table. Two groups of entries, and the difference matters:
#
#   1. Route-backed (82 pairs, every group above the SEED-ONLY marker): each traces
#      to a real protectedMidaz(auth, resource, verb) registration (= auth.Authorize(
#      "midaz", resource, verb)); the file:line on each group header points at it.
#   2. Seed-only (19 pairs, the marked block at the end of `permissions:`): the seed
#      grants them, no route registers them. Declared for PARITY — see that block's
#      own comment.
#
# So do NOT read an entry here as proof that a route enforces it. The invariant is
# the other direction: every seeded grant appears here, and every route-backed pair
# appears here.
#
# FOUR route-backed pairs are NOT yet in the seed: (account-block-exceptions, post),
# (dashboard, get), (fee-debts, get) and (fee-debts, post). All three resources are new here, so until
# the central seed (caradhras deploy/pam-seed/init_data.json) grants them, the declaration is a
# SUPERSET of the seed on those pairs rather than a mirror. The routes enforce
# them either way — an environment whose policy store has not learned a resource
# simply answers 403, which is the fail-closed direction for a block bypass and
# for an aggregate money view alike.
#
# `resource` is written BARE — the central reconciler composes the "midaz/"
# prefix. The `action` is the HTTP verb the guard authorizes under
# (get/post/put/patch/delete/head), preserved VERBATIM: lib-auth's HTTP-verb
# deny-list was removed (lib-auth #145 / identity #310), and the manifest action
# MUST match what the middleware checks, so a granted role's permission lines up
# with the runtime enforce — NOT a semantic create/read/update rename.
#
# ROLE MODEL IS DERIVED FROM the central Access Manager seed (caradhras,
# deploy/pam-seed/init_data.json), not invented here. The code carries no role data
# (Authorize takes only subject/resource/action), so the seed is the only source of
# truth for who gets what. The three seeded tiers (fee resources are embedded in
# this manifest, no separate fees manifest):
#
#   editor      -> get/post/put/patch/delete/head (asset-rates uses put)
#   contributor -> get/post/patch/head — every mutating verb EXCEPT delete
#   viewer      -> read-only (get/head)
#
# This manifest must stay a SUPERSET of the seed. The tenant-manager's
# template-origin prune deletes the seeded RBAC on reconcile, so a tier or a grant
# missing here is not merely undeclared — it stops existing. That is why the
# `contributor` tier was added (54 grants) AND why the 44 grants over pairs no route
# registers are declared too (19 pairs, the SEED-ONLY block): 98 grants in total
# that adopting the declaration would otherwise have revoked.
#
# The granted_to group bindings under `roles:` are likewise confirmed against the
# seed (see below).
service: midaz
version: 1
partners: true
scope:
  dimensions:
    - { name: organizationId,     from: path, param: organization_id,      required: true,  multi: false, collection: organizations,      label: "Midaz organization" }
    - { name: ledgerId,           from: path, param: ledger_id,            required: false, multi: true,  collection: ledgers,            label: "ledger",
        covers: [holders, instruments, protection], parent: organizationId }
    - { name: accountTypeId,      from: path, param: account_type_id,      required: false, multi: true,  collection: account-types,      label: "account type", parent: ledgerId }
    - { name: accountId,          from: path, param: account_id,           required: false, multi: true,  collection: accounts,           label: "account",
        covers: [balances, transactions, operations, fee-debts, dashboard, account-block-exceptions, instruments, holders], parent: ledgerId }
    - { name: accountAlias,       from: path, param: alias,                required: false, multi: true,  collection: accounts,           label: "account alias",
        covers: [balances, transactions, operations, fee-debts, dashboard, account-block-exceptions, instruments, holders], parent: ledgerId }
    - { name: assetId,            from: path, param: asset_id,             required: false, multi: true,  collection: assets,             label: "asset", parent: ledgerId }
    - { name: portfolioId,        from: path, param: portfolio_id,         required: false, multi: true,  collection: portfolios,         label: "portfolio",
        covers: [accounts, balances, transactions, operations, fee-debts, dashboard, account-block-exceptions, instruments, holders], parent: ledgerId }
    - { name: segmentId,          from: path, param: segment_id,           required: false, multi: true,  collection: segments,           label: "segment",
        covers: [accounts, balances, transactions, operations, fee-debts, dashboard, account-block-exceptions, instruments, holders], parent: ledgerId }
    - { name: balanceId,          from: path, param: balance_id,           required: false, multi: true,  collection: balances,           label: "balance", parent: accountId }
    - { name: transactionId,      from: path, param: transaction_id,       required: false, multi: true,  collection: transactions,       label: "transaction", parent: ledgerId }
    - { name: operationId,        from: path, param: operation_id,         required: false, multi: true,  collection: operations,         label: "operation", parent: accountId }
    - { name: operationRouteId,   from: path, param: operation_route_id,   required: false, multi: true,  collection: operation-routes,   label: "operation route", parent: ledgerId }
    - { name: transactionRouteId, from: path, param: transaction_route_id, required: false, multi: true,  collection: transaction-routes, label: "transaction route", parent: ledgerId }
    - { name: holderId,           from: path, param: holder_id,            required: false, multi: true,  collection: holders,            label: "holder",
        covers: [accounts, balances, transactions, operations, fee-debts, dashboard, account-block-exceptions, instruments], parent: organizationId }
    - { name: instrumentId,       from: path, param: instrument_id,        required: false, multi: true,  collection: instruments,        label: "instrument", parent: holderId }
    - { name: relatedPartyId,     from: path, param: related_party_id,     required: false, multi: true,  collection: related-parties,    label: "related party", parent: instrumentId }
    - { name: billingPackageId,   from: path, param: billing_package_id,   required: false, multi: true,  collection: billing-packages,   label: "billing package", parent: ledgerId }
    - { name: packageId,          from: path, param: package_id,           required: false, multi: true,  collection: packages,           label: "fee package", parent: ledgerId }
    - { name: feeDebtId,          from: path, param: fee_debt_id,          required: false, multi: true,  collection: fee-debts,          label: "fee debt", parent: ledgerId }
  routes:
    - method: POST
      path: /v2/transactions/direct
      dimensions: &v2CreateBodyDimensions
        - { name: organizationId, from: body, field: "debits[].organizationId" }
        - { name: ledgerId,       from: body, field: "debits[].ledgerId" }
        - { name: accountAlias,   from: body, field: "debits[].alias",  optional: true }
        - { name: organizationId, from: body, field: "credits[].organizationId" }
        - { name: ledgerId,       from: body, field: "credits[].ledgerId" }
        - { name: accountAlias,   from: body, field: "credits[].alias", optional: true }
    - { method: POST, path: /v2/transactions/hold,    dimensions: *v2CreateBodyDimensions }
    - { method: POST, path: /v2/transactions/block,   dimensions: *v2CreateBodyDimensions }
    - { method: POST, path: /v2/transactions/unblock, dimensions: *v2CreateBodyDimensions }
    - method: POST
      path: /v2/transactions/batch
      dimensions:
        - { name: organizationId, from: body, field: "transactions[].debits[].organizationId" }
        - { name: ledgerId,       from: body, field: "transactions[].debits[].ledgerId" }
        - { name: accountAlias,   from: body, field: "transactions[].debits[].alias",  optional: true }
        - { name: organizationId, from: body, field: "transactions[].credits[].organizationId" }
        - { name: ledgerId,       from: body, field: "transactions[].credits[].ledgerId" }
        - { name: accountAlias,   from: body, field: "transactions[].credits[].alias", optional: true }
    - method: POST
      path: /v1/organizations/:organization_id/ledgers/:ledger_id/transactions/json
      dimensions: &v1SourceAliasDimensions
        - { name: accountAlias, from: body, field: "send.source.from[].accountAlias", optional: true }
    - { method: POST, path: /v1/organizations/:organization_id/ledgers/:ledger_id/transactions/annotation, dimensions: *v1SourceAliasDimensions }
    - { method: POST, path: /v1/organizations/:organization_id/ledgers/:ledger_id/transactions/block,      dimensions: *v1SourceAliasDimensions }
    - { method: POST, path: /v1/organizations/:organization_id/ledgers/:ledger_id/transactions/unblock,    dimensions: *v1SourceAliasDimensions }
    - { method: POST, path: /v1/organizations/:organization_id/ledgers/:ledger_id/transactions/outflow,    dimensions: *v1SourceAliasDimensions }
    - method: POST
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/accounts/block-exceptions
      dimensions:
        - { name: accountAlias, from: body, field: "exceptions[].accountAlias", optional: true }
    - method: POST
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/fee-debts/collect
      dimensions:
        - { name: accountAlias, from: body, field: accountAlias, optional: true }
    - method: GET
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/fee-debts
      dimensions:
        - { name: accountAlias, from: query, field: account_alias, optional: true }
    - method: POST
      path: /v2/organizations/:organization_id/holders/:holder_id/instruments
      dimensions:
        - { name: ledgerId,  from: body, field: ledgerId }
        - { name: accountId, from: body, field: accountId }
    - method: POST
      path: /v1/organizations/:organization_id/ledgers/:ledger_id/accounts
      dimensions:
        - { name: portfolioId, from: body, field: portfolioId,     optional: true }
        - { name: segmentId,   from: body, field: segmentId,       optional: true }
        - { name: accountId,   from: body, field: parentAccountId, optional: true }
    - method: POST
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/accounts
      dimensions:
        - { name: portfolioId, from: body, field: portfolioId,     optional: true }
        - { name: segmentId,   from: body, field: segmentId,       optional: true }
        - { name: holderId,    from: body, field: holderId,        optional: true }
        - { name: accountId,   from: body, field: parentAccountId, optional: true }
    - method: POST
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/holders/:holder_id/accounts
      dimensions:
        - { name: portfolioId, from: body, field: portfolioId,     optional: true }
        - { name: segmentId,   from: body, field: segmentId,       optional: true }
        - { name: accountId,   from: body, field: parentAccountId, optional: true }
    - method: POST
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/billing-packages
      dimensions:
        - { name: segmentId,   from: body, field: accountTarget.segmentId,   optional: true }
        - { name: portfolioId, from: body, field: accountTarget.portfolioId, optional: true }
        - { name: accountAlias, from: body, field: "accountTarget.aliases[]", optional: true }
    - method: POST
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/packages
      dimensions:
        - { name: segmentId, from: body, field: segmentId, optional: true }
    - method: GET
      path: /v1/organizations/:organization_id/ledgers/:ledger_id/accounts
      dimensions: &accountListQueryDimensions
        - { name: portfolioId, from: query, field: portfolio_id, optional: true }
        - { name: segmentId,   from: query, field: segment_id,   optional: true }
        - { name: holderId,    from: query, field: holder_id,    optional: true }
    - method: GET
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/accounts
      dimensions: *accountListQueryDimensions
    - method: GET
      path: /v2/organizations/:organization_id/instruments
      dimensions:
        - { name: holderId,  from: query, field: holder_id,  optional: true }
        - { name: accountId, from: query, field: account_id, optional: true }
        - { name: ledgerId,  from: query, field: ledger_id,  optional: true }
    - method: GET
      path: /v2/organizations/:organization_id/holders/:holder_id/accounts
      dimensions:
        - { name: ledgerId, from: query, field: ledger_id, optional: true }
    - method: GET
      path: /v2/organizations/:organization_id/ledgers/:ledger_id/packages
      dimensions:
        - { name: segmentId, from: query, field: segmentId, optional: true }
permissions:
  # account-types (account_type_routes.go registerAccountTypeRoutesToApp)
  - { resource: account-types, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: account-types, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: account-types, action: get,    effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: account-types, action: delete, effect: allow, roles: [editor], level: ledgerId }

  # account-block-exceptions (account_block_exception_routes.go
  # registerAccountBlockExceptionRoutesToApp; /v2 only)
  #
  # DELIBERATELY editor-only. Minting an exception authorizes a debit out of a
  # BLOCKED account, so it is a privileged action distinct from both account CRUD
  # and the permission to transact: a contributor that may post transactions and
  # patch accounts still cannot mint a bypass, and viewer has no read to grant
  # (the surface is write-only — an exception is presented, never listed).
  - { resource: account-block-exceptions, action: post, effect: allow, roles: [editor], level: accountId }

  # accounts (account_routes.go registerAccountRoutesToApp)
  - { resource: accounts, action: post,   effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: accounts, action: patch,  effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: accounts, action: get,    effect: allow, roles: [editor, contributor, viewer], level: accountId }
  - { resource: accounts, action: delete, effect: allow, roles: [editor], level: accountId }
  - { resource: accounts, action: head,   effect: allow, roles: [editor, contributor, viewer], level: accountId }

  # asset-rates (asset_rate_routes.go registerAssetRateRoutesToApp)
  - { resource: asset-rates, action: put, effect: allow, roles: [editor], level: ledgerId }
  - { resource: asset-rates, action: get, effect: allow, roles: [editor, contributor, viewer], level: ledgerId }

  # assets (asset_routes.go registerAssetRoutesToApp)
  - { resource: assets, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: assets, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: assets, action: get,    effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: assets, action: delete, effect: allow, roles: [editor], level: ledgerId }
  - { resource: assets, action: head,   effect: allow, roles: [editor, contributor, viewer], level: ledgerId }

  # balances (balance_routes.go registerBalanceRoutesToApp)
  - { resource: balances, action: get,    effect: allow, roles: [editor, contributor, viewer], level: accountId }
  - { resource: balances, action: patch,  effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: balances, action: delete, effect: allow, roles: [editor], level: accountId }
  - { resource: balances, action: post,   effect: allow, roles: [editor, contributor], level: accountId }

  # billing-calculate — billing calculate dry-run (billing_calculate_routes.go registerBillingCalculateRoutesToApp)
  - { resource: billing-calculate, action: post, effect: allow, roles: [editor, contributor], level: ledgerId }

  # billing-packages (billing_package_routes.go registerBillingPackageRoutesToApp)
  - { resource: billing-packages, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: billing-packages, action: get,    effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: billing-packages, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: billing-packages, action: delete, effect: allow, roles: [editor], level: ledgerId }

  # dashboard (dashboard_routes.go registerDashboardRoutesToApp; /v1 and /v2)
  #
  # A DEDICATED resource rather than a borrowed transactions/balances grant. The
  # three reads publish AGGREGATE money figures over both tables, so folding them
  # into either grant would silently widen what that grant means — a
  # transactions:get would start disclosing balance positions. Read-only, so
  # `get` is the only verb and all three tiers hold it.
  #
  # Like (account-block-exceptions, post) above, this pair is NOT yet in the
  # central seed (caradhras deploy/pam-seed/init_data.json), so the declaration is
  # a SUPERSET of the seed on it until that lands. A policy-enforcing environment
  # whose store has not learned the resource answers 403, which is the
  # fail-closed direction; components/ledger/docs/dashboard.md states the
  # dependency for operators.
  - { resource: dashboard, action: get, effect: allow, roles: [editor, contributor, viewer], level: ledgerId }

  # encryption (encryption_routes.go registerEncryptionRoutesToApp)
  - { resource: encryption, action: post, effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: encryption, action: get,  effect: allow, roles: [editor, contributor, viewer], level: organizationId }

  # estimates — fee estimate dry-run (fee_estimate_routes.go registerFeeEstimateRoutesToApp)
  - { resource: estimates, action: post, effect: allow, roles: [editor, contributor], level: ledgerId }

  # fee-debts — fee debt record (fee_debt_routes.go RegisterFeeDebtV2RoutesToApp) and its
  # standalone collection (fee_debt_collect_routes.go); /v2 only. Not yet in the central seed.
  - { resource: fee-debts, action: get,  effect: allow, roles: [editor, contributor, viewer], level: accountId }
  - { resource: fee-debts, action: post, effect: allow, roles: [editor, contributor], level: accountId }

  # holders (holder_routes.go registerHolderRoutesToApp)
  - { resource: holders, action: post,   effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: holders, action: get,    effect: allow, roles: [editor, contributor, viewer], level: organizationId }
  - { resource: holders, action: patch,  effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: holders, action: delete, effect: allow, roles: [editor], level: organizationId }

  # instruments (instrument_routes.go registerInstrumentRoutesToApp)
  - { resource: instruments, action: get,    effect: allow, roles: [editor, contributor, viewer], level: accountId }
  - { resource: instruments, action: post,   effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: instruments, action: patch,  effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: instruments, action: delete, effect: allow, roles: [editor], level: accountId }

  # ledgers (ledger_routes.go registerLedgerRoutesToApp)
  - { resource: ledgers, action: post,   effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: ledgers, action: patch,  effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: ledgers, action: get,    effect: allow, roles: [editor, contributor, viewer], level: organizationId }
  - { resource: ledgers, action: delete, effect: allow, roles: [editor], level: organizationId }
  - { resource: ledgers, action: head,   effect: allow, roles: [editor, contributor, viewer], level: organizationId }

  # operation-routes (operation_route_routes.go registerOperationRouteRoutesToApp)
  - { resource: operation-routes, action: post,   effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: operation-routes, action: patch,  effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: operation-routes, action: get,    effect: allow, roles: [editor, contributor, viewer], level: organizationId }
  - { resource: operation-routes, action: delete, effect: allow, roles: [editor], level: organizationId }

  # operations (operation_routes.go registerOperationRoutesToApp)
  - { resource: operations, action: get,   effect: allow, roles: [editor, contributor, viewer], level: accountId }
  - { resource: operations, action: patch, effect: allow, roles: [editor, contributor], level: accountId }

  # organizations (organization_routes.go registerOrganizationRoutesToApp)
  - { resource: organizations, action: post,   effect: allow, roles: [editor, contributor], level: tenant }
  - { resource: organizations, action: patch,  effect: allow, roles: [editor, contributor], level: tenant }
  - { resource: organizations, action: get,    effect: allow, roles: [editor, contributor, viewer], level: tenant }
  - { resource: organizations, action: delete, effect: allow, roles: [editor], level: tenant }
  - { resource: organizations, action: head,   effect: allow, roles: [editor, contributor, viewer], level: tenant }

  # packages — fee packages (fee_package_routes.go registerPackageRoutesToApp)
  - { resource: packages, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: packages, action: get,    effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: packages, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: packages, action: delete, effect: allow, roles: [editor], level: ledgerId }

  # portfolios (portfolio_routes.go registerPortfolioRoutesToApp)
  - { resource: portfolios, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: portfolios, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: portfolios, action: get,    effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: portfolios, action: delete, effect: allow, roles: [editor], level: ledgerId }
  - { resource: portfolios, action: head,   effect: allow, roles: [editor, contributor, viewer], level: ledgerId }

  # protection — CRM audit-trail read (audit_routes.go registerAuditRoutesToApp)
  - { resource: protection, action: get, effect: allow, roles: [editor, contributor, viewer], level: organizationId }

  # segments (segment_routes.go registerSegmentRoutesToApp)
  - { resource: segments, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: segments, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: segments, action: get,    effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: segments, action: delete, effect: allow, roles: [editor], level: ledgerId }
  - { resource: segments, action: head,   effect: allow, roles: [editor, contributor, viewer], level: ledgerId }

  # settings — entity metadata (metadata_routes.go registerMetadataIndexRoutesToApp)
  - { resource: settings, action: post,   effect: allow, roles: [editor, contributor], level: tenant }
  - { resource: settings, action: get,    effect: allow, roles: [editor, contributor, viewer], level: tenant }
  - { resource: settings, action: delete, effect: allow, roles: [editor], level: tenant }

  # streaming-manifest — event catalog (streaming_manifest_routes.go RegisterStreamingManifestRouteToApp)
  - { resource: streaming-manifest, action: get, effect: allow, roles: [editor, viewer], level: tenant }

  # transaction-routes (transaction_route_routes.go registerTransactionRouteRoutesToApp)
  - { resource: transaction-routes, action: post,   effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: transaction-routes, action: patch,  effect: allow, roles: [editor, contributor], level: organizationId }
  - { resource: transaction-routes, action: get,    effect: allow, roles: [editor, contributor, viewer], level: organizationId }
  - { resource: transaction-routes, action: delete, effect: allow, roles: [editor], level: organizationId }

  # transactions (transaction_routes.go RegisterTransactionHumaRoutesToApp;
  # v2 at transaction_routes_v2.go RegisterTransactionV2RoutesToApp and
  # transaction_mirror_register_v2.go RegisterTransactionMirrorV2RoutesToApp)
  - { resource: transactions, action: post,  effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: transactions, action: patch, effect: allow, roles: [editor, contributor], level: accountId }
  - { resource: transactions, action: get,   effect: allow, roles: [editor, contributor, viewer], level: accountId }
  - { resource: transactions, action: head,  effect: allow, roles: [editor, contributor, viewer], level: accountId }

  # ─── SEED-ONLY GRANTS: no route registers these (resource, action) pairs ───
  #
  # Declared for PARITY, not because a route checks them. The seed
  # (caradhras deploy/pam-seed/init_data.json) grants each pair below, and the
  # tenant-manager's template-origin prune deletes the seeded RBAC on reconcile —
  # so a pair omitted here would be REVOKED by adopting the declaration, which
  # would make this change a removal rather than a mechanism swap.
  #
  # Every pair ABOVE traces to a real protectedMidaz(...) registration; NONE of the
  # pairs below do. They are kept in one contiguous block on purpose: whoever
  # decides to drop the unreachable surface can delete this section wholesale,
  # without touching a single route-backed grant.
  # account-types
  - { resource: account-types, action: head,   effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  # asset-rates
  - { resource: asset-rates, action: delete, effect: allow, roles: [editor], level: ledgerId }
  - { resource: asset-rates, action: head,   effect: allow, roles: [editor, contributor, viewer], level: ledgerId }
  - { resource: asset-rates, action: patch,  effect: allow, roles: [editor, contributor], level: ledgerId }
  - { resource: asset-rates, action: post,   effect: allow, roles: [editor, contributor], level: ledgerId }

name: PR Title Validation

on:
  pull_request:
    branches: [develop, release-candidate, main]
    types: [edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-title:
    name: Validate Title
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: LerianStudio/github-actions-shared-workflows/src/validate/pr-title@v1
        with:
          github-token: ${{ github.token }}
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          scopes: |
            crm
            ledger
            tracer
            fees
            api
            pkg
            infra
            migrations
            scripts
            deps
            ci
            docs
            tests
          require-scope: 'false'

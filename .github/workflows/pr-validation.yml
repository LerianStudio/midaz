name: PR Validation

on:
  pull_request:
    branches: [develop, release-candidate, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  validate:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-pr-validation.yml@v1.56.0
    with:
      enforce_source_branches: true
      allowed_source_branches: 'hotfix/*|release-candidate'
      target_branches_for_source_check: 'main'
      # crm and fees are valid commit scopes even though both now live inside the
      # ledger binary. Scope is warn-only (require_scope: false).
      pr_title_scopes: |
        crm
        ledger
        tracer
        fees
        api
        pkg
        infra
        migrations
        scripts
        deps
        ci
        docs
        tests
      go_version: "1.26.6"
      golangci_lint_version: "v2.12.2"
      app_name_prefix: "midaz"
      # Analysis-class filter: every component dir with in-tree Go code. CRM rolls
      # up under components/ledger (a ledger package tree, not a standalone
      # component); reporter was extracted out of this repo entirely.
      filter_paths: |
        components/ledger
        components/tracer
      go_private_modules: "github.com/LerianStudio/*"
      ignore_file: ".trivyignore"
      # Default plus .coderabbit.yaml: it's a CodeRabbit-only config file,
      # not something the Go analysis/security pipelines need to react to.
      ignore_globs: "*.md docs/* .github/* LICENSE* .gitignore .coderabbit.yaml"
      shared_paths: |
        go.mod
        go.sum
        components/
        pkg/
        Makefile
    secrets: inherit

  # Required gate: regenerate OpenAPI/Swagger docs and fail if the committed
  # artifacts under components/<c>/api and postman/specs are stale. The openapi.yaml
  # step runs openapitools/openapi-generator-cli, which requires Docker on the runner.
  check-docs:
    name: Check Docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Install swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # check-docs.sh converts the Huma OAS dumps via node -e "require('js-yaml')"
      # under NODE_PATH=postman/generator/node_modules. node_modules is gitignored,
      # so the deps must be installed here or the require fails.
      - name: Install doc generator deps
        run: npm ci --prefix postman/generator

      - name: Verify docs are up to date
        run: CHECK_DOCS_REGEN=1 make check-docs

  # Required gate: regenerate the gRPC stubs from proto/ and fail if the committed
  # stubs under pkg/proto are stale. buf and the protoc plugins run via pinned
  # remote plugins (BUF_VERSION + buf.gen.yaml), so no global install is needed.
  check-proto:
    name: Check Proto
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify protobuf stubs are up to date
        run: make proto-check

  # The reusable v1.46.5 integration hook runs once inside every
  # filter_paths working directory and its umbrella workflow does not expose
  # integration_test_command. Midaz's integration/property targets live only at
  # the monorepo root, so dedicated root jobs are the only non-duplicating path.
  integration:
    # Keep the four independent external contexts stable. Lifecycle and chaos
    # are internal proofs aggregated into the existing lifecycle context below.
    name: ${{ (matrix.shard == 'lifecycle-migration' || matrix.shard == 'chaos-capability') && format('Integration internal / {0}', matrix.shard) || format('Integration / {0}', matrix.shard) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard:
          - ledger-postgres
          - ledger-mongodb-crm
          - async-broker
          - tracer
          - lifecycle-migration
          - chaos-capability
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Install test reporter
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run bounded integration shard
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: scripts/run-integration-ci-shard.sh "$INTEGRATION_SHARD"

      - name: Upload integration timing and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.shard }}-reports
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  integration-required:
    # This external name is intentionally stable for the repository ruleset.
    name: Integration / lifecycle-migration
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact integration outcome artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: integration-*-reports
          path: reports/required-integration

      - name: Prove every deferred capability passed
        run: scripts/verify-integration-capability.sh reports/required-integration

      - name: Require every base shard and capability lane
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$INTEGRATION_RESULT" = success

  property:
    name: Property Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run root property lane
        run: scripts/run-ci-lane.sh property 15m make test-property LOW_RESOURCE=1

      - name: Upload property timing and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: property-reports
          path: reports/ci/property*
          if-no-files-found: warn
          retention-days: 7

name: PR Validation

on:
  pull_request:
    branches: [develop, release-candidate, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  validate:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-pr-validation.yml@tier-2
    with:
      pr_title_scopes: |
        crm
        ledger
        tracer
        fees
        api
        pkg
        infra
        migrations
        scripts
        deps
        ci
        docs
        tests
        release
      go_version: "1.27.2"
      golangci_lint_version: "v2.13.2"
      app_name_prefix: "midaz"
      filter_paths: |
        components/ledger
        components/tracer
      go_private_modules: "github.com/LerianStudio/*"
      ignore_file: ".trivyignore"
      ignore_globs: "*.md docs/* .github/* LICENSE* .gitignore .coderabbit.yaml"
      shared_paths: |
        go.mod
        go.sum
        components/
        pkg/
        Makefile
    secrets: inherit

  check-proto:
    name: Check Proto
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Verify protobuf stubs are up to date
        run: make proto-check

  integration:
    # Keep the four independent external contexts stable. Lifecycle and chaos
    # are internal proofs aggregated into the existing lifecycle context below.
    name: ${{ (matrix.shard == 'lifecycle-migration' || matrix.shard == 'chaos-capability') && format('Integration internal / {0}', matrix.shard) || format('Integration / {0}', matrix.shard) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard:
          - ledger-postgres
          - ledger-mongodb-crm
          - async-broker
          - tracer
          - lifecycle-migration
          - chaos-capability
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install test reporter
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run bounded integration shard
        env:
          INTEGRATION_SHARD: ${{ matrix.shard }}
        run: scripts/run-integration-ci-shard.sh "$INTEGRATION_SHARD"

      - name: Upload integration timing and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ matrix.shard }}-reports
          path: reports/ci/
          if-no-files-found: warn
          retention-days: 7

  integration-required:
    # This external name is intentionally stable for the repository ruleset.
    name: Integration / lifecycle-migration
    if: always()
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact integration outcome artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: integration-*-reports
          path: reports/required-integration

      - name: Prove every deferred capability passed
        run: scripts/verify-integration-capability.sh reports/required-integration

      - name: Require every base shard and capability lane
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$INTEGRATION_RESULT" = success


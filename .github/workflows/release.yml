name: Release

on:
  push:
    branches: [develop, release-candidate, main]
    tags: ['**']

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  dockerhub-visibility:
    uses: ./.github/workflows/dockerhub-visibility.yml
    with:
      strict: false
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_IMAGE_PUSH_TOKEN: ${{ secrets.DOCKERHUB_IMAGE_PUSH_TOKEN }}
      DOCKERHUB_REPO_ADMIN_TOKEN: ${{ secrets.DOCKERHUB_REPO_ADMIN_TOKEN }}

  pipeline:
    needs: dockerhub-visibility
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-release.yml@tier-2
    with:
      enable_changelog: ${{ github.ref == 'refs/heads/main' }}
      release_single_app: true
      # A Dockerfile without ARG REVISION fails the release instead of only
      # warning: the compiled build identity must not silently regress.
      require_build_identity: true
      app_name_prefix: "midaz"
      filter_paths: |
        components/ledger
        components/tracer
      shared_paths: |
        go.mod
        go.sum
        pkg/
        Makefile
      extra_builds: |
        [
          {
            "filter_paths": "components/ledger/migrations-image",
            "path_level": 1,
            "app_name_overrides": "components/ledger/migrations-image:midaz-ledger-migrations",
            "force_full_matrix": true,
            "require_build_identity": false,
            "shared_paths": "components/ledger/migrations\ncomponents/ledger/migrations-image"
          },
          {
            "filter_paths": "components/tracer/migrations-image",
            "path_level": 1,
            "app_name_overrides": "components/tracer/migrations-image:midaz-tracer-migrations",
            "force_full_matrix": true,
            "require_build_identity": false,
            "shared_paths": "components/tracer/migrations\ncomponents/tracer/migrations-image"
          }
        ]
      enable_gitops_artifacts: true
      enable_ungoliant_release_diff: true
      ungoliant_env_type: chaos
      ungoliant_tenancy: st
      enable_helm_dispatch: true
      helm_chart: "midaz"
      helm_values_key_mappings: '{"midaz-ledger": "ledger", "midaz-tracer": "tracer"}'
      gitops_yaml_key_mappings: '{"midaz-ledger.tag": ".ledger.image.tag", "midaz-tracer.tag": ".tracer.image.tag", "midaz-ledger-migrations.tag": ".ledger.migrations.image.tag", "midaz-tracer-migrations.tag": ".tracer.migrations.image.tag"}'
      s3_uploads: '[{"s3_bucket":"lerian-migration-files","file_pattern":"components/ledger/migrations/onboarding/*.sql","s3_prefix":"ledger/onboarding/postgresql","strip_prefix":"components/ledger/migrations/onboarding","flatten":false},{"s3_bucket":"lerian-migration-files","file_pattern":"components/ledger/migrations/transaction/*.sql","s3_prefix":"ledger/transaction/postgresql","strip_prefix":"components/ledger/migrations/transaction","flatten":false},{"s3_bucket":"lerian-migration-files","file_pattern":"components/ledger/migrations/onboarding/mongodb/*.json","s3_prefix":"ledger/onboarding/mongodb","strip_prefix":"components/ledger/migrations/onboarding/mongodb","flatten":false},{"s3_bucket":"lerian-migration-files","file_pattern":"components/ledger/migrations/transaction/mongodb/*.json","s3_prefix":"ledger/transaction/mongodb","strip_prefix":"components/ledger/migrations/transaction/mongodb","flatten":false},{"s3_bucket":"lerian-migration-files","file_pattern":"components/tracer/migrations/*.sql","s3_prefix":"tracer/tracer-api/postgresql","strip_prefix":"components/tracer/migrations","flatten":false}]'
    secrets: inherit

  # The consignado estate's tenant-manager bucket takes ledger Postgres migrations
  # only from the protected branches: main -> production/, release-candidate -> staging/.
  consignado_tenant_migrations:
    if: github.repository == 'LerianStudio/midaz' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-candidate')
    strategy:
      matrix:
        module: [onboarding, transaction]
    permissions:
      id-token: write
      contents: read
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/s3-upload.yml@bdf1d46b1f6dbb79356dd7895cda7126ebf4b637 # v1.76.0
    with:
      s3_bucket: tenant-manager-prd-migrations-862902859103
      file_pattern: components/ledger/migrations/${{ matrix.module }}/*.sql
      s3_prefix: ledger/${{ matrix.module }}/postgresql
      strip_prefix: components/ledger/migrations/${{ matrix.module }}
      flatten: false
      aws_region: sa-east-1
    secrets:
      AWS_ROLE_ARN: arn:aws:iam::862902859103:role/consignado-midaz-github-oidc-s3-upload

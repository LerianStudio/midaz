name: Release

on:
  push:
    branches: [maintenance/v3.8.x]
    tags: ['**']

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  pipeline:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/go-release.yml@v1.81.1
    with:
      enable_changelog: true
      release_single_app: true
      app_name_prefix: "midaz"
      filter_paths: |
        components/crm
        components/ledger
      shared_paths: |
        go.mod
        go.sum
        pkg/
        Makefile
      enable_gitops_artifacts: false
      enable_ungoliant_release_diff: false
      ungoliant_env_type: chaos
      ungoliant_tenancy: st
      enable_helm_dispatch: true
      helm_chart: "midaz"
      helm_values_key_mappings: '{"midaz-crm": "crm", "midaz-ledger": "ledger"}'
      gitops_yaml_key_mappings: '{"midaz-crm.tag": ".crm.image.tag", "midaz-ledger.tag": ".ledger.image.tag"}'
      enable_apidog_e2e: false
      s3_uploads: '[{"s3_bucket":"lerian-migration-files","file_pattern":"components/ledger/migrations/onboarding/*.sql","s3_prefix":"ledger/onboarding/postgresql","strip_prefix":"components/ledger/migrations/onboarding","flatten":false},{"s3_bucket":"lerian-migration-files","file_pattern":"components/ledger/migrations/transaction/*.sql","s3_prefix":"ledger/transaction/postgresql","strip_prefix":"components/ledger/migrations/transaction","flatten":false}]'
      enable_gitops_update: false
      helm_detect_env_changes: false
      enable_e2e_tests: false
    secrets: inherit

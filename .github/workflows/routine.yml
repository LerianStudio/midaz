name: Repository Routines

on:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    types: [closed]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      routine:
        description: Routine to run
        type: choice
        options:
          - all
          - branch-cleanup-stale
          - stale-pr
          - stale-issue
          - labels-sync
          - workflow-runs-cleanup
          - backmerge
        default: all
      dry_run:
        description: Preview changes without applying them
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  routine:
    if: inputs.routine != 'backmerge'
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/routine.yml@tier-2
    with:
      routine: ${{ inputs.routine || 'all' }}
      dry_run: ${{ inputs.dry_run || false }}
      merged_branch: ${{ github.head_ref }}
      extra_protected_branches: "fork"
    secrets: inherit

  backmerge:
    if: |
      (github.event_name == 'push' && github.ref_name == 'develop')
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && (inputs.routine == 'all' || inputs.routine == 'backmerge'))
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/backmerge.yml@tier-2
    with:
      rules: |
        [
          { "from": "develop", "to": "fork", "mode": "direct-with-pr-fallback" }
        ]
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit

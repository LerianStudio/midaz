name: Sync fork branch with develop

# Keeps the persistent `fork` branch up to date so external contributors
# aren't rebasing against a stale base. Runs only on pushes to develop
# (never triggered by anything fork-related), so it's always same-repo and
# safe with the normal write-scoped GITHUB_TOKEN.
#
# A real merge commit, not a fast-forward: `fork` accumulates its own
# commits (from merged fork PRs not yet promoted to develop via
# fork-pr-promote.yml), so it diverges from develop in both directions.
# On conflict, this fails loudly instead of guessing — a maintainer
# resolves it manually, since that means an unpromoted fork change
# conflicts with something that just landed on develop.

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  sync:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fork
          fetch-depth: 0

      - name: Merge develop into fork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit origin/develop; then
            echo "::error::Merging develop into fork hit a conflict — an unpromoted fork change conflicts with something just merged into develop. Resolve manually."
            exit 1
          fi
          git push origin fork

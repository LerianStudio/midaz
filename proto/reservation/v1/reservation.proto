syntax = "proto3";

package lerian.midaz.reservation.v1;

option go_package = "github.com/LerianStudio/midaz/v4/pkg/proto/reservation/v1;reservationv1";

// ReservationService is the gRPC transport for the tracer's two-phase
// reservation seam. It mirrors the REST contract (POST /v1/reservations plus
// the per-id and by-transaction confirm/release transitions) field-for-field so
// the ledger can select gRPC or REST behind the TracerReserver interface without
// any behavioral difference. Identity on this seam is mutual TLS; the tenant is
// propagated out-of-band as the trusted "x-tenant-id" gRPC metadata key (never a
// message field).
service ReservationService {
  // Reserve evaluates rules and holds capacity (phase one). DENY/REVIEW are
  // completed decisions with no retained reservations, not transport errors.
  rpc Reserve(ReserveRequest) returns (ReserveResult);

  // ConfirmByTransaction commits EVERY reservation a transaction holds.
  rpc ConfirmByTransaction(ConfirmByTransactionRequest) returns (ConfirmByTransactionResponse);

  // ReleaseByTransaction returns EVERY reservation a transaction holds.
  rpc ReleaseByTransaction(ReleaseByTransactionRequest) returns (ReleaseByTransactionResponse);

  // ConfirmById completes the operation addressed by a coordinated reservation.
  // Without a contract revision it only addresses a single legacy reservation.
  rpc ConfirmById(ConfirmByIdRequest) returns (ConfirmByIdResponse);

  // ReleaseById releases the operation addressed by a coordinated reservation.
  // Without a contract revision it only addresses a single legacy reservation.
  rpc ReleaseById(ReleaseByIdRequest) returns (ReleaseByIdResponse);
}

// AssetRef identifies an asset in the authenticated producer namespace.
message AssetRef {
  string namespace = 1;
  string id = 2;
  string code = 3;
}

// ContextAccount carries producer facts without imposing a Ledger taxonomy.
message ContextAccount {
  string id = 1;
  string type = 2;
  string status = 3;
  optional bool blocked = 4;
  AssetRef asset = 5;
}

// ContextEntry is one prepared posting, including fee postings.
message ContextEntry {
  string account_id = 1;
  bool external = 2;
  string direction = 3;
  string amount = 4;
  AssetRef asset = 5;
}

// EvaluationContext preserves entry ordering and multiplicity.
message EvaluationContext {
  repeated ContextAccount accounts = 1;
  repeated ContextEntry entries = 2;
}

// ReserveRequest replaces the old contract on the same RPC. Removed field
// numbers cannot be reused; an old binary must fail contract verification.
message ReserveRequest {
  reserved 1 to 11;
  reserved "account", "segment_id", "portfolio_id", "merchant_id", "transaction_type";
  string contract_revision = 16;
  string transaction_id = 17;
  string request_id = 18;
  string context_id = 19;
  string validation_mode = 20;
  string transaction_timestamp = 21;
  optional bool long_lived = 22;
  string amount = 23;
  AssetRef asset = 24;
  EvaluationContext context = 25;
}

// ReserveControls explicitly confirms which requested controls completed.
message ReserveControls {
  string rules = 1;
  string limits = 2;
}

// ReserveResult is the immutable completed decision, not a transport error.
message ReserveResult {
  reserved 1 to 3;
  reserved "denied";
  string contract_revision = 16;
  string transaction_id = 17;
  string evaluation_id = 18;
  string decision = 19;
  ReserveControls controls = 20;
  repeated string reservation_ids = 21;
  repeated string reasons = 22;
}

// ConfirmByTransactionRequest commits every reservation held by a transaction.
message ConfirmByTransactionRequest {
  string transaction_id = 1;
  string contract_revision = 16;
}

// ReleaseByTransactionRequest releases every reservation held by a transaction.
message ReleaseByTransactionRequest {
  string transaction_id = 1;
  string contract_revision = 16;
}

// ConfirmByIdRequest addresses the owning operation under the new revision.
message ConfirmByIdRequest {
  string reservation_id = 1;
  string contract_revision = 16;
}

// ReleaseByIdRequest addresses the owning operation under the new revision.
message ReleaseByIdRequest {
  string reservation_id = 1;
  string contract_revision = 16;
}

// Coordinated responses acknowledge the revision and known operation outcome.
// Transaction completion may precede admission, so evaluation_id is optional.
// flipped counts movements in this call and is zero on a committed replay.
// Legacy calls without revision retain their empty response messages.

// ConfirmByTransactionResponse is the response to ConfirmByTransaction.
message ConfirmByTransactionResponse {
  string contract_revision = 16;
  string transaction_id = 17;
  string status = 19;
  int32 flipped = 20;
  optional string evaluation_id = 21;
}

// ReleaseByTransactionResponse is the response to ReleaseByTransaction.
message ReleaseByTransactionResponse {
  string contract_revision = 16;
  string transaction_id = 17;
  string status = 19;
  int32 flipped = 20;
  optional string evaluation_id = 21;
}

// ConfirmByIdResponse is the response to ConfirmById.
message ConfirmByIdResponse {
  string contract_revision = 16;
  string transaction_id = 17;
  string reservation_id = 18;
  string status = 19;
  optional string evaluation_id = 21;
}

// ReleaseByIdResponse is the response to ReleaseById.
message ReleaseByIdResponse {
  string contract_revision = 16;
  string transaction_id = 17;
  string reservation_id = 18;
  string status = 19;
  optional string evaluation_id = 21;
}

syntax = "proto3";

package lerian.midaz.reservation.v1;

option go_package = "github.com/LerianStudio/midaz/v4/pkg/proto/reservation/v1;reservationv1";

// ReservationService is the tracer's two-phase reservation seam: reserve, then
// the per-id and by-transaction confirm/release transitions. It is the only
// surface that drives the reservation lifecycle, and the ledger is its only
// caller. Identity on this seam is mutual TLS (or the service mesh); the tenant
// is propagated out-of-band as the trusted "x-tenant-id" gRPC metadata key
// (never a message field).
service ReservationService {
  // Reserve holds limit capacity for a transaction (phase one). A denied
  // decision is a successful response with denied=true and empty
  // reservation_ids, not a transport error.
  rpc Reserve(ReserveRequest) returns (ReserveResult);

  // ConfirmByTransaction commits EVERY reservation a transaction holds.
  rpc ConfirmByTransaction(ConfirmByTransactionRequest) returns (ConfirmByTransactionResponse);

  // ReleaseByTransaction returns EVERY reservation a transaction holds.
  rpc ReleaseByTransaction(ReleaseByTransactionRequest) returns (ReleaseByTransactionResponse);

  // ConfirmById commits a single held reservation.
  rpc ConfirmById(ConfirmByIdRequest) returns (ConfirmByIdResponse);

  // ReleaseById returns a single held reservation's capacity.
  rpc ReleaseById(ReleaseByIdRequest) returns (ReleaseByIdResponse);
}

// ReserveAccount is the account scope the tracer matches limits and rules
// against. It mirrors the ledger-side ReserveAccount. An empty account_id parses
// to the nil UUID, which the relaxed reserve validation accepts (external-only
// source).
message ReserveAccount {
  string account_id = 1;
  // type is the caller's account type, free-form (ledger Account.Type). Optional.
  string type = 2;
}

// ReserveRequest is the gRPC form of the reserve body. It mirrors the ledger's
// ReserveRequest field-for-field. amount is a decimal-as-string (NEVER a
// double); transaction_timestamp is an RFC3339 string.
message ReserveRequest {
  string transaction_id = 1;
  string request_id = 2;
  // amount is a decimal serialized as a string to avoid float rounding.
  string amount = 3;
  string asset = 4;
  ReserveAccount account = 5;
  string segment_id = 6;
  string portfolio_id = 7;
  string merchant_id = 8;
  // transaction_type is optional on reserve; the ledger forwards the scheme
  // the /v2 body declared, empty otherwise.
  string transaction_type = 9;
  // transaction_timestamp is RFC3339; the tracer rejects a future timestamp
  // against its injected clock.
  string transaction_timestamp = 10;
  // long_lived hints the tracer to assign a long-lived reservation lifetime to
  // a PENDING-transaction reservation.
  bool long_lived = 11;
  // metadata is the caller's flat transaction metadata. Keys ^[a-zA-Z0-9_]+$,
  // <=64 chars, <=50 entries. Optional.
  map<string, string> metadata = 12;
  // revert marks the reservation as the revert of an applied transaction. The
  // tracer skips rule evaluation for it and still reserves limit capacity.
  bool revert = 13;
}

// ReserveResult is the handle returned by a successful reserve. denied is the
// refusal flag every client reads: when true no capacity is held and
// reservation_ids is empty. Otherwise reservation_ids holds one id per
// counter-backed limit the ledger must later confirm or release. decision
// refines denied without replacing it, so a client that ignores decision keeps
// its behavior.
message ReserveResult {
  string transaction_id = 1;
  bool denied = 2;
  repeated string reservation_ids = 3;
  // decision is ALLOW, DENY or REVIEW. denied is true for DENY and REVIEW.
  string decision = 4;
  // reason is a short machine/human hint: "limit_exceeded" or the rule
  // evaluator's reason. Empty on ALLOW.
  string reason = 5;
  // matched_rule_ids lists the rules that produced a DENY or REVIEW decision.
  repeated string matched_rule_ids = 6;
}

// ConfirmByTransactionRequest commits every reservation held by a transaction.
message ConfirmByTransactionRequest {
  string transaction_id = 1;
}

// ReleaseByTransactionRequest releases every reservation held by a transaction.
message ReleaseByTransactionRequest {
  string transaction_id = 1;
}

// ConfirmByIdRequest commits a single reservation by its id.
message ConfirmByIdRequest {
  string reservation_id = 1;
}

// ReleaseByIdRequest releases a single reservation by its id.
message ReleaseByIdRequest {
  string reservation_id = 1;
}

// The confirm/release transitions are idempotent. Each transition owns its
// response message (buf forbids sharing a response type across RPCs): the
// confirm responses report what the call found, the release responses stay
// empty.

// ConfirmByTransactionResponse is the response to ConfirmByTransaction.
message ConfirmByTransactionResponse {
  // Rows this call moved to CONFIRMED (RESERVED or EXPIRED before the call).
  uint32 confirmed = 1;
  // Rows of the transaction that were already RELEASED: spend that will never be counted.
  uint32 already_released = 2;
}

// ReleaseByTransactionResponse is the response to ReleaseByTransaction.
message ReleaseByTransactionResponse {}

// ConfirmByIdResponse is the response to ConfirmById.
message ConfirmByIdResponse {
  // True when the row was already RELEASED, so the confirm settled nothing.
  bool already_released = 1;
}

// ReleaseByIdResponse is the response to ReleaseById.
message ReleaseByIdResponse {}

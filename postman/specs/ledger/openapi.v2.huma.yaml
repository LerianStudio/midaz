    CreateTransactionV2Input:
      additionalProperties: false
      description: "Transaction request body. Each side of the transaction is spelled EITHER with its scalar field (`from`, `to`) OR with its leg array (`sources`, `destinations`) — never both on the same side, though the two sides may choose differently. Leave the spelling you are not using OUT of the body: on `from` and `to` an explicit `null` is rejected. `asset`, `amount`, `description`, `code`, `routeId`, `operationRouteId` and `metadata` are common to both forms, and `amount` is always the transaction total that the legs' `share` expressions divide. Each leg array holds at most 500 legs."
      properties:
        amount:
          type: string
        asset:
          type: string
        code:
          type: string
        description:
          type: string
        destinations:
          items:
            $ref: "#/components/schemas/V2LegInput"
          type:
            - array
            - "null"
        from:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        operationRouteId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        routeId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        sources:
          items:
            $ref: "#/components/schemas/V2LegInput"
          type:
            - array
            - "null"
        to:
          type: string
      required:
        - asset
        - amount
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          description: "Stable, machine-readable domain error code scoped to the emitting service (format: <SERVICE>-NNNN)."
          examples:
            - ERR-0001
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
        upstream:
          $ref: "#/components/schemas/Upstream"
          description: "RFC 9457 extension member: the error a proxied third-party provider reported. Absent unless the emitting service explicitly surfaced one."
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'

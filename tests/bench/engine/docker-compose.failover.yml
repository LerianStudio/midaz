# Owned, disposable promotion topology (Task 1.3.1 B), separate from midaz-bench-engine. Only TestPromotionTopology
# loads it, as -p midaz-bench-failover after docker-compose.yml; the ports have no default. PostgreSQL settings and the
# named synchronous standby come unchanged from the base file and init-primary.sql.
name: midaz-bench-failover

services:
  bench-pg-primary:
    container_name: bench-failover-pg-primary
    ports: !override
      - "127.0.0.1:${BENCH_PG_PRIMARY_PORT:?owned primary port required}:5432"
    mem_limit: 8g
    memswap_limit: 8g

  bench-toxiproxy:
    container_name: bench-failover-toxiproxy
    ports: !override
      - "127.0.0.1:${BENCH_PG_CLIENT_PROXY_PORT:?owned client proxy port required}:5434"
      - "127.0.0.1:${BENCH_TOXIPROXY_PORT:?owned toxiproxy api port required}:8474"
    mem_limit: 256m
    memswap_limit: 256m

  bench-pg-standby:
    container_name: bench-failover-pg-standby
    ports: !override
      - "127.0.0.1:${BENCH_PG_STANDBY_PORT:?owned standby port required}:5432"
    mem_limit: 8g
    memswap_limit: 8g
